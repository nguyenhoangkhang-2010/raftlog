# One raftlogd node. A 3-node Raft cluster comes in a later branch.
# Every value below can be overridden from the shell or a .env file, e.g.
#   RAFTLOG_PORT=9093 docker compose -f deploy/docker-compose.yml up --build
# The node itself is configured through RAFTLOG_* environment variables
# (see internal/config).
services:
  raftlogd:
    build: { context: .., dockerfile: deploy/Dockerfile }
    environment:
      RAFTLOG_LISTEN_ADDR: ":9092"
      RAFTLOG_DATA_DIR: "/data"
      RAFTLOG_SEGMENT_MAX_BYTES: "${RAFTLOG_SEGMENT_MAX_BYTES:-0}"
      RAFTLOG_INDEX_INTERVAL_BYTES: "${RAFTLOG_INDEX_INTERVAL_BYTES:-0}"
      RAFTLOG_SYNC_ON_APPEND: "${RAFTLOG_SYNC_ON_APPEND:-false}"
    ports: ["${RAFTLOG_PORT:-9092}:9092"]
    volumes: ["raftlog-data:/data"]

volumes:
  raftlog-data:
