\* A model with a deliberate mistake: a node votes for a candidate whose log is behind its own (the election
\* restriction of section 5.4.1 is removed). The checker must find a leader that lacks an entry that was committed
\* (LeaderCompleteness), or two nodes that committed different entries.
SPECIFICATION Spec
CONSTANTS
    Server = {s1, s2, s3}
    Value = {v1}
    Nil = Nil
    MaxTerm = 3
    MaxLogLen = 2
    MaxMessages = 12
    BugVoteTwice = FALSE
    BugNoUpToDateCheck = TRUE
    BugCommitOldTerms = FALSE
CONSTRAINT Bounded
SYMMETRY SymmetricServers
INVARIANTS LeaderCompleteness StateMachineSafety CommittedOnAMajority
CHECK_DEADLOCK FALSE
