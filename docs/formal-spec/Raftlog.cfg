\* The real protocol, with the three nodes of the usual cluster. The bounds keep the space finite;
\* see README.md for what they leave out and for the figures of a run.
SPECIFICATION Spec
CONSTANTS
    Server = {s1, s2, s3}
    Value = {v1}
    Nil = Nil
    MaxTerm = 2
    MaxLogLen = 2
    MaxMessages = 10
    BugVoteTwice = FALSE
    BugNoUpToDateCheck = FALSE
    BugCommitOldTerms = FALSE
CONSTRAINT Bounded
SYMMETRY SymmetricServers
INVARIANTS TypeOK ElectionSafety LogMatching StateMachineSafety CommittedAreUnique LeaderCompleteness CommittedOnAMajority
CHECK_DEADLOCK FALSE
