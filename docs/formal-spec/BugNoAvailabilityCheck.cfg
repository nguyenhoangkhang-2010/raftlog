\* A model with a deliberate mistake: a placement is not checked against the points that are available, so two
\* orders can set aside the same points. The checker must find a point that is spent twice.
SPECIFICATION Spec
CONSTANTS
    Order = {o1, o2, o3}
    MaxUse = 2
    MaxEarn = 2
    MaxAdjust = 2
    AllowRefunds = FALSE
    BugNoAvailabilityCheck = TRUE
CONSTRAINT Bounded
INVARIANTS NoOverspend
CHECK_DEADLOCK FALSE
