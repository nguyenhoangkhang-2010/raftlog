\* A model with a deliberate mistake: a node may vote for two candidates in the same term. The checker must find
\* two leaders in one term (ElectionSafety). A check that cannot fail would prove nothing.
SPECIFICATION Spec
CONSTANTS
    Server = {s1, s2, s3}
    Value = {v1}
    Nil = Nil
    MaxTerm = 2
    MaxLogLen = 1
    MaxMessages = 12
    BugVoteTwice = TRUE
    BugNoUpToDateCheck = FALSE
    BugCommitOldTerms = FALSE
CONSTRAINT Bounded
SYMMETRY SymmetricServers
INVARIANTS ElectionSafety
CHECK_DEADLOCK FALSE
