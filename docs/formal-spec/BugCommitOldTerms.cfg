\* A model with a deliberate mistake: the leader commits an entry of an earlier term as soon as a majority has it
\* (the rule of section 5.4.2, the case of figure 8 of the Raft paper, is removed). The checker must find a
\* committed entry that a later leader overwrites. It starts from the state InitFigure8, a few steps from the case
\* (see Raftlog.tla for why), and has no client writes, only the no-op entries.
INIT InitFigure8
NEXT Next
CONSTANTS
    Server = {s1, s2, s3}
    Value = {}
    Nil = Nil
    MaxTerm = 5
    MaxLogLen = 2
    MaxMessages = 10
    BugVoteTwice = FALSE
    BugNoUpToDateCheck = FALSE
    BugCommitOldTerms = TRUE
CONSTRAINT Bounded
SYMMETRY SymmetricServers
INVARIANTS LeaderCompleteness CommittedOnAMajority
CHECK_DEADLOCK FALSE
